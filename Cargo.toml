[package]
name = "alcro"
version = "0.6.0"
authors = ["Srinivasa <m.srinivasa1234@gmail.com>"]
edition = "2021"
description = "A library to create desktop apps using rust and modern web technologies"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/Srinivasa314/alcro"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tinyfiledialogs = "3.9"
libc = "0.2"
dashmap = "6.1"
thiserror = "2.0"
tempfile = "3.10"
nix = { version = "0.31", features = ["fs", "signal", "process"] }
tokio = { version = "1.53", features = ["rt", "sync", "io-util", "net", "time"] }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = [
    "std",
    "errhandlingapi",
    "fileapi",
    "handleapi",
    "minwinbase",
    "minwindef",
    "namedpipeapi",
    "ntdef",
    "processthreadsapi",
    "synchapi",
    "winbase",
    "winnt",
] }

[dev-dependencies]
actix-web = "4"
rust-embed = "8"
mime_guess = "2"
anyhow = "1"
tokio = { version = "1.53", features = ["rt", "rt-multi-thread", "macros", "fs"] }
